    body { margin: 0; }
    a { color: var(--accent-500, #cc6600); }
    a:hover { color: var(--accent-600, #b35a00); }
    @keyframes ama-flip {
      0%, 8%   { transform: translateY(0) rotate(0deg); }
      22%, 27% { transform: translateY(0) rotate(180deg); }
      30% { transform: translateY(-5px) rotate(calc(180deg - var(--amp, 9deg))); }
      33% { transform: translateY(3px)  rotate(calc(180deg + var(--amp, 9deg))); }
      36% { transform: translateY(-5px) rotate(calc(180deg - var(--amp, 9deg))); }
      39% { transform: translateY(3px)  rotate(calc(180deg + var(--amp, 9deg))); }
      42% { transform: translateY(-3px) rotate(calc(180deg - var(--amp, 9deg) * 0.5)); }
      45% { transform: translateY(0)    rotate(calc(180deg + var(--amp, 9deg) * 0.3)); }
      48%, 78% { transform: translateY(0) rotate(180deg); }
      92%, 100% { transform: translateY(0) rotate(360deg); }
    }
    @keyframes ama-pool-bottom {
      0%, 12% { opacity: 1; }
      22%, 84% { opacity: 0; }
      92%, 100% { opacity: 1; }
    }
    @keyframes ama-pool-neck {
      0%, 19% { opacity: 0; }
      27%, 52% { opacity: 1; }
      58%, 100% { opacity: 0; }
    }
    @keyframes ama-lines {
      0%, 27% { opacity: 0; }
      31% { opacity: 1; }
      34% { opacity: 0; }
      37% { opacity: 1; }
      40% { opacity: 0; }
      43% { opacity: 1; }
      47%, 100% { opacity: 0; }
    }
    @keyframes ama-drop {
      0%, 47% { transform: translateY(0) scale(0); opacity: 1; }
      54% { transform: translateY(0) scale(1.05); opacity: 1; }
      56% { transform: translateY(3px) scale(1); opacity: 1; }
      68% { transform: translateY(76px) scale(1); opacity: 1; }
      71%, 100% { transform: translateY(84px) scale(0.5); opacity: 0; }
    }
    @keyframes ama-splash {
      0%, 67% { opacity: 0; transform: scale(0.3); }
      70% { opacity: 1; transform: scale(1); }
      78%, 100% { opacity: 0; transform: scale(1.2); }
    }
    @keyframes ama-route {
      0%, 8% { offset-distance: 0%; }
      88%, 100% { offset-distance: 100%; }
    }
    @keyframes ama-pop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 560},
  &quot;speed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.4, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;unit&quot;: &quot;x&quot;, &quot;section&quot;: &quot;Animation&quot;, &quot;tsType&quot;: &quot;number&quot;},
  &quot;shake&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 9, &quot;min&quot;: 3, &quot;max&quot;: 15, &quot;step&quot;: 1, &quot;unit&quot;: &quot;deg&quot;, &quot;section&quot;: &quot;Animation&quot;, &quot;tsType&quot;: &quot;number&quot;},
  &quot;loop&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Animation&quot;, &quot;tsType&quot;: &quot;boolean&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const speed = this.props.speed ?? 1;
    return {
      dur: (6 / speed).toFixed(2) + 's',
      iter: (this.props.loop ?? true) ? 'infinite' : '1',
      amp: (this.props.shake ?? 9) + 'deg'
    };
  }
}
</script>
